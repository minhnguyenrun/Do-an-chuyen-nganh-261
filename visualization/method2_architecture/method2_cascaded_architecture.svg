<text x='85' y='266' font-family='Arial,sans-serif' font-size='23' font-weight='normal' fill='#243247'>Width W, height H</text>
<rect x='465' y='155' width='500' height='180' fill='#EAF1FA' stroke='#7595BC' stroke-width='2'/>
