<text x='65' y='69' font-family='Arial,sans-serif' font-size='39' font-weight='bold' fill='#243247'>METHOD 2  |  Cascaded Document Layout Analysis</text>
<text x='65' y='111' font-family='Arial,sans-serif' font-size='25' font-weight='normal' fill='#243247'>Current implementation: v2.1  /  Two independent variants with a shared downstream architecture</text>
